name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Set up ONNX Runtime Web + AI upscale models
        run: npm run setup
        # `setup:ort` copies onnxruntime-web's WASM runtime files
        # (~74 MB) into public/ort/ so Vite serves them at /ort/.
        # `setup:models` fetches AI upscale model weights (~64 MB)
        # into public/models/. Both get baked into dist/ via Vite's
        # public/ → dist/ copy. Failures here are non-fatal — the app
        # still ships, just without the AI upscale option.
        continue-on-error: true
      - run: npm run build
        env:
          VITE_BASE_PATH: /poncho/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
