<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poncho — NES Emulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="layout" class="layout">
      <!-- Sidebar (L1) is built in JS so its icons can be SVG components. -->
      <aside id="sidebar-host" class="layout-sidebar"></aside>
      <aside id="panel-l2-host" class="layout-l2"></aside>
      <aside id="panel-l3-host" class="layout-l3"></aside>

      <main class="layout-main">
        <header class="title-bar">
          <!-- main.ts toggles which child is visible based on whether
               a game is loaded. Both kept in the DOM so CSS transitions
               can animate between them. -->
          <div id="brand" class="brand">
            <span class="brand-glyph">P</span>
            <span class="brand-name">Poncho</span>
          </div>
          <div id="game-title" class="game-title" hidden>
            <h1 class="game-title-name" data-title></h1>
            <p class="game-title-sub" data-subtitle></p>
          </div>
        </header>
        <div class="screen-frame">
          <canvas id="screen" width="256" height="240"></canvas>
        </div>
        <footer class="status-bar">
          <span id="status-text" class="status-text">No ROM loaded.</span>
          <span id="fps" class="fps">— FPS</span>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/shells/web/main.ts"></script>
  </body>
</html>
