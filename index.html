<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poncho — NES Emulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="layout" class="layout">
      <!-- Sidebar (L1) is built in JS so its icons can be SVG components. -->
      <aside id="sidebar-host" class="layout-sidebar"></aside>
      <aside id="panel-l2-host" class="layout-l2"></aside>
      <aside id="panel-l3-host" class="layout-l3"></aside>

      <main class="layout-main">
        <div class="brand">
          <span class="brand-glyph">P</span>
          <span class="brand-name">Poncho</span>
        </div>
        <div class="screen-frame">
          <canvas id="screen" width="256" height="240"></canvas>
        </div>
        <footer class="status-bar">
          <span id="status-text" class="status-text">No ROM loaded.</span>
          <span id="fps" class="fps">— FPS</span>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
